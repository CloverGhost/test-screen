<body>

<style>

    #test-toast strong { font-size: clamp(24px, 4.5vw, 36px) !important; line-height: 1.4 !important; font-weight: 700 !important; display: block; margin-bottom: 4px; }

    #test-toast.show { opacity: 1; }
    #test-toast.init-center { top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; text-align: center !important; border-radius: 16px !important; width: max-content !important; max-width: 90%; }
    
    @keyframes breathWhiteBlack { 0%, 100% { background-color: #000; } 50% { background-color: #fff; } }
    @keyframes breathRGB { 0% { background-color: #f00; } 33% { background-color: #0f0; } 66% { background-color: #00f; } 100% { background-color: #f00; } }
    .flash-wb { animation: breathWhiteBlack 0.5s steps(1, end) infinite !important; }
    .flash-rgb { animation: breathRGB 0.7s steps(1, end) infinite !important; }
    .motion-block { position: absolute; top: 50%; transform: translateY(-50%); width: 120px; height: 120px; background: #ffffff; border: 2px solid #000000; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

    @media (max-width: 360px) {
        .control-panel { padding: 12px; } .preset-grid { gap: 3px; } .rgb-sliders { padding: 5px; gap: 5px; } .slider-group input[type="number"] { width: 32px; font-size: 10px; } select, button { padding: 6px 8px; font-size: 11px; }
    }
</style>

<script>
    'use strict';

    const body = document.body;
    const panel = document.getElementById('panel');
    const wakeBtn = document.getElementById('wake-btn');
    const bgCanvas = document.getElementById('bg-canvas');
    const colorNameDisplay = document.getElementById('colorName');
    const testToast = document.getElementById('test-toast');
    const brightnessOverlay = document.getElementById('brightness-overlay');

    let currentR = 255, currentG = 255, currentB = 255;
    let isPanelHidden = false; let hideTimeout = null;
    window.isTestingMode = false;
    let testColorIndex = 0; let touchTimer = null; let isLongPressAction = false; let lastLockTimestamp = 0; 
    let wakeLockObj = null; 
    let motionAnimId = null;

    function stopMotionAnimation() {
        if (motionAnimId) {
            cancelAnimationFrame(motionAnimId);
            motionAnimId = null;
        }
    }

    const colorDictionary = [
        { r: 255, g: 255, b: 255, name: "纯白" }, { r: 0, g: 0, b: 0, name: "纯黑" },
        { r: 255, g: 0, b: 0, name: "正红" }, { r: 0, g: 255, b: 0, name: "纯绿" },
        { r: 0, g: 0, b: 255, name: "纯蓝" }, { r: 255, g: 255, b: 0, name: "明黄" },
        { r: 0, g: 255, b: 255, name: "青色" }, { r: 255, g: 0, b: 255, name: "品红" },
        { r: 128, g: 128, b: 128, name: "中灰" }, { r: 255, g: 182, b: 193, name: "浅粉" },
        { r: 245, g: 245, b: 220, name: "象牙白" }, { r: 129, g: 216, b: 208, name: "蒂芙尼蓝" }
    ];

    function updateBrightness(val) {
        document.getElementById('brightnessVal').innerText = val;
        brightnessOverlay.style.opacity = (100 - val) / 100;
    }

    function checkResolution() {
        const dpr = window.devicePixelRatio || 1;
        const isFull = document.fullscreenElement || body.classList.contains('ios-viewport-lock');
        const physW = Math.round(window.screen.width * dpr);
        const physH = Math.round(window.screen.height * dpr);
        const renderW = Math.round(window.innerWidth * dpr);
        const renderH = Math.round(window.innerHeight * dpr);

        if (document.getElementById('physRes')) document.getElementById('physRes').innerText = `${physW} × ${physH} 像素`;
        if (document.getElementById('renderRes')) document.getElementById('renderRes').innerText = `${renderW} × ${renderH} 像素`;

        const statusEl = document.getElementById('p2pStatus');
        if (statusEl) {
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (Math.abs(renderW - physW) <= 2 && Math.abs(renderH - physH) <= 2) {
                statusEl.innerText = "🟢 极佳状态：发光晶格点对点完美重合 (测屏最准)";
                statusEl.style.color = "#34c759";
            } else {
                if (isMobile) {
                    statusEl.innerText = "🟡 提示：请点击“开始检测”或“全屏”以锁定最佳画质";
                } else {
                    statusEl.innerText = `🟡 网页有轻微缩放 (当前 ${dpr.toFixed(1)} 倍渲染) ➜ 建议按 Ctrl+0 恢复默认`;
                }
                statusEl.style.color = "#ff9500";
            }
        }
        return { physW, physH, renderW, renderH };
    }

    function getClosestColorName(r, g, b) {
        let minDistance = Infinity; let closestColor = "自定义颜色";
        for (const color of colorDictionary) {
            const distance = Math.sqrt(Math.pow(r - color.r, 2) + Math.pow(g - color.g, 2) + Math.pow(b - color.b, 2));
            if (distance === 0) return color.name;
            if (distance < minDistance) { minDistance = distance; closestColor = color.name; }
        }
        return minDistance > 60 ? `自定义色 (近${closestColor})` : closestColor;
    }
</script>

<script>
    function updateRGB(source) {
        if (window.isTestingMode) return; 
        if (source === 'input') {
            let r = parseInt(document.getElementById('valR').value, 10);
            let g = parseInt(document.getElementById('valG').value, 10);
            let b = parseInt(document.getElementById('valB').value, 10);
            if (isNaN(r) || r < 0) r = 0; if (r > 255) r = 255;
            if (isNaN(g) || g < 0) g = 0; if (g > 255) g = 255;
            if (isNaN(b) || b < 0) b = 0; if (b > 255) b = 255;
            currentR = r; currentG = g; currentB = b;
        } else {
            currentR = parseInt(document.getElementById('rangeR').value, 10);
            currentG = parseInt(document.getElementById('rangeG').value, 10);
            currentB = parseInt(document.getElementById('rangeB').value, 10);
        }
        document.getElementById('valR').value = currentR; document.getElementById('valG').value = currentG; document.getElementById('valB').value = currentB;
        document.getElementById('rangeR').value = currentR; document.getElementById('rangeG').value = currentG; document.getElementById('rangeB').value = currentB;

        body.className = ''; bgCanvas.style.backgroundImage = "none"; bgCanvas.style.backgroundColor = "transparent"; bgCanvas.style.border = "none";
        body.style.backgroundColor = `rgb(${currentR}, ${currentG}, ${currentB})`;
        colorNameDisplay.innerText = `当前颜色：${getClosestColorName(currentR, currentG, currentB)}`;
        checkResolution();
    }

    function setHex(hex) {
        if (window.isTestingMode) return;
        document.getElementById('rangeR').value = parseInt(hex.slice(1, 3), 16);
        document.getElementById('rangeG').value = parseInt(hex.slice(3, 5), 16);
        document.getElementById('rangeB').value = parseInt(hex.slice(5, 7), 16);
        updateRGB('slider'); 
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().then(() => { hidePanel(); syncWakeLock(); }).catch(() => iosPureFullscreenFallback());
            } else { iosPureFullscreenFallback(); }
        } else { if (document.exitFullscreen) document.exitFullscreen(); }
    }

    function iosPureFullscreenFallback() { body.classList.add('ios-viewport-lock'); hidePanel(); checkResolution(); syncWakeLock(); }
    
    document.addEventListener('fullscreenchange', () => { 
        if (!document.fullscreenElement) { 
            body.classList.remove('ios-viewport-lock'); 
            if (isPanelHidden && !window.isTestingMode) showPanel(); 
        }
        syncWakeLock();
    });
    
    function handleResChange() { document.getElementById('custom-res-inputs').style.display = document.getElementById('resolution').value === 'custom' ? 'flex' : 'none'; }

    function validateCustomRes(inputEl) {
        let val = parseInt(inputEl.value, 10);
        if (isNaN(val)) return; 
        if (val < 1) inputEl.value = 1;
        if (val > 16384) inputEl.value = 16384;
    }

    function downloadImage() {
        const resValue = document.getElementById('resolution').value;
        let width, height;
        if (resValue === 'current') {
            const res = checkResolution(); width = res.physW; height = res.physH;
        } else if (resValue === 'custom') {
            let userW = parseInt(document.getElementById('customW').value, 10);
            let userH = parseInt(document.getElementById('customH').value, 10);
            if (isNaN(userW) || userW < 1) userW = 3840; if (userW > 16384) userW = 16384;
            if (isNaN(userH) || userH < 1) userH = 2160; if (userH > 16384) userH = 16384;
            width = userW; height = userH;
        } else {
            const parts = resValue.split('x'); width = parseInt(parts[0], 10); height = parseInt(parts[1], 10); 
        }
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d'); ctx.fillStyle = `rgb(${currentR}, ${currentG}, ${currentB})`; ctx.fillRect(0, 0, width, height);
        try {
            const matchedName = getClosestColorName(currentR, currentG, currentB).replace(/\s/g, "");
            const link = document.createElement('a'); link.download = `${matchedName}-${width}x${height}-[R${currentR}_G${currentG}_B${currentB}].png`;
            link.href = canvas.toDataURL('image/png'); link.click();
        } catch (error) { alert('图片生成失败（移动端超高分辨率可能有内存限制）。'); }
    }
    window.addEventListener('resize', checkResolution);

<script>
    async function syncWakeLock() {
        const needLock = document.fullscreenElement || body.classList.contains('ios-viewport-lock') || window.isTestingMode;
        if (needLock) {
            if (!wakeLockObj && 'wakeLock' in navigator) {
                try { wakeLockObj = await navigator.wakeLock.request('screen'); } catch (err) { console.warn("常亮锁请求被拒绝:", err.message); }
            }
        } else {
            if (wakeLockObj !== null) {
                try {
                    await wakeLockObj.release();
                } catch (e) {
                    console.warn('WakeLock释放失败:', e);
                } finally {
                    wakeLockObj = null;
                }
            }
        }
    }

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncWakeLock(); });

    function generateStepGradient(steps) {
        let str = "linear-gradient(to right, ";
        for (let i = 0; i < steps; i++) {
            let val = Math.round((i / (steps - 1)) * 255);
            let start = ((i / steps) * 100).toFixed(2);
            let end = (((i + 1) / steps) * 100).toFixed(2);
            str += `rgb(${val},${val},${val}) ${start}%, rgb(${val},${val},${val}) ${end}%${i === steps - 1 ? '' : ', '}`;
        }
        return str + ")";
    }

    const testScenes = [
        { type: "color", r: 255, g: 255, b: 255, name: "1/22 纯白基准 (漏光与黑边测试)", desc: "查四角发暗、IPS边缘背光挤压漏光、整体亮度均匀度" },
        { type: "color", r: 0, g: 0, b: 0, name: "2/22 纯黑基准 (亮点与光晕测试)", desc: "查物理亮点、OLED像素漏光。Mini-LED可在此项查分区控光光晕" },
        { type: "color", r: 255, g: 0, b: 0, name: "3/22 红色像素 (副像素死点与饱和度)", desc: "检查 R 副像素死点、红纯度表现、OLED 红色老化残留" },
        { type: "color", r: 0, g: 255, b: 0, name: "4/22 绿色像素 (副像素死点与饱和度)", desc: "检查 G 副像素死点。绿色对人眼最敏感，专查偏色" },
        { type: "color", r: 0, g: 0, b: 255, name: "5/22 蓝色像素 (副像素死点与饱和度)", desc: "检查 B 副像素死点，防范高能蓝光通道不均匀衰减" },
        { type: "color", r: 255, g: 255, b: 0, name: "6/22 明黄二级色 (饱和度色彩均匀度)", desc: "检测红绿混合像素供电是否均衡，查 OLED 大面积烧屏残影" },
        { type: "color", r: 0, g: 255, b: 255, name: "7/22 青色二级色 (色域与双色准度)", desc: "检测绿蓝混合像素准度，评估设计屏的宽色域表现" },
        { type: "color", r: 255, g: 0, b: 255, name: "8/22 品红二级色 (副像素激发同步性)", desc: "检测红蓝混合副像素激发同步性" },
        { type: "color", r: 128, g: 128, b: 128, name: "9/22 50%中灰 (脏屏效应 DSE 测试)", desc: "检查背光纸感、屏幕是否有分布不均的黑斑纹理（脏屏效应）" },
        { type: "pattern", patternType: "gray-16", name: "10/22 16阶标准灰度 (基础对比度与阶梯检测)", desc: "观察能否区分黑白之间16个灰度阶梯，测试屏幕基础对比度" },
        { type: "pattern", patternType: "gray-64", name: "11/22 64阶精细灰度 (深度色阶解析力)", desc: "考验面板灰阶下潜深度与高光平滑度，防止色彩塌陷" },
        { type: "pattern", patternType: "gradient-256", name: "12/22 256级全色阶渐变 (色深断层测试)", desc: "评估 8bit/10bit 色深。平滑无痕说明达 10bit，出现明显色带说明渐变过渡可能存在断层" },
        { type: "pattern", patternType: "gradient-rgb", name: "13/22 RGB全色彩平滑渐变 (广色域过度测试)", desc: "测试红绿蓝及二级色过渡的平滑性，可辅助观察渐变过渡是否平滑" },
        { type: "pattern", patternType: "gradient-dark", name: "14/22 0%-10% 极暗色阶 (暗部细节测试)", desc: "检测暗部细节吃字情况。高质量屏幕能清晰分辨靠近纯黑的灰色阶" },
        { type: "pattern", patternType: "gradient-bright", name: "15/22 90%-100% 极亮色阶 (高光细节测试)", desc: "检测高光过曝性能。查过亮色彩是否丢失细节导致死白" },
        { type: "pattern", patternType: "grid-distortion", name: "16/22 网格与几何畸变 (广角/曲面屏枕形畸变)", desc: "检查画面是否有桶形/枕形畸变，边缘红色包边检测有效显示域" },
        { type: "pattern", patternType: "grid-1px", name: "17/22 1像素微矩阵 (点对点对焦测试)", desc: "像素硬核对齐。字迹工作者核心，若有彩边毛刺说明发虚易疲劳" },
        { type: "pattern", patternType: "checker", name: "18/22 极限棋盘格 (边缘对比度测试)", desc: "测试明暗交界处物理对比度边缘锐利度、动态像素残像" },
        { type: "pattern", patternType: "stripe-h", name: "19/22 水平单像素线阵 (时钟干扰测试)", desc: "检测横向时钟同步。若画面出现水波纹说明高频驱动不稳" },
        { type: "pattern", patternType: "stripe-v", name: "20/22 垂直单像素线阵 (信号干扰测试)", desc: "检测垂直数据信号延迟，专查行列串扰（Crosstalk拖尾）" },
        { type: "pattern", patternType: "motion-blur", name: "21/22 动态拖影与响应时间 (方块高速移动测试)", desc: "高对比度方块平滑移动。观察方块后方拖尾长度判断面板响应时间 (GtG)" },
        { type: "pattern", patternType: "flash-wb", name: "22/22 黑白/三原色高频急变 (电路呼吸效应)", desc: "极限压榨电源板瞬变动态负载。肉眼观察几何图形是否位移抖动" }
    ];

    function showTestToast(content, duration = 1800) {
        testToast.className = '';
        testToast.innerHTML = content;
        testToast.classList.add('show');

        if (window.toastTimeout) {
            clearTimeout(window.toastTimeout);
        }

        window.toastTimeout = setTimeout(() => {
            testToast.classList.remove('show');
        }, duration);
    }

    function startScreenTest(e) {
        if (e) { e.stopPropagation(); e.preventDefault(); }

        if (window.isTestingMode) return;
        window.isTestingMode = true; testColorIndex = 0; panel.classList.add('hidden'); isPanelHidden = true;
        if (hideTimeout) clearTimeout(hideTimeout); wakeBtn.classList.remove('visible'); 
        lastLockTimestamp = Date.now() + 500; 

        syncWakeLock(); 

        if (!document.fullscreenElement) { 
            if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(() => { body.classList.add('ios-viewport-lock'); }); } 
            else { body.classList.add('ios-viewport-lock'); }
        }

        testToast.className = ''; testToast.innerHTML = "深度检测模式启动";
        testToast.classList.add('init-center'); testToast.classList.add('show'); 
        if (window.toastTimeout) clearTimeout(window.toastTimeout);
        
        window.toastTimeout = setTimeout(() => {
            testToast.classList.remove('show'); 
            setTimeout(() => { testToast.classList.remove('init-center'); renderScene(0); checkResolution(); }, 250); 
        }, 1500);
    }

    function renderScene(step) {
        stopMotionAnimation();
        bgCanvas.innerHTML = '';
        
        testColorIndex = (testColorIndex + step + testScenes.length) % testScenes.length;
        const scene = testScenes[testColorIndex];
        
        body.className = ''; bgCanvas.innerHTML = ''; bgCanvas.style.backgroundSize = "auto"; bgCanvas.style.backgroundPosition = "0 0"; bgCanvas.style.backgroundImage = "none"; bgCanvas.style.backgroundColor = "transparent"; body.style.backgroundColor = "transparent";

        if (motionAnimId) {
            cancelAnimationFrame(motionAnimId);
            motionAnimId = null;
        }
        if (scene.type === "color") { 
            body.style.backgroundColor = `rgb(${scene.r}, ${scene.g}, ${scene.b})`; 
        } 
        else if (scene.type === "pattern") {
            body.style.backgroundColor = "#fff"; 
            if (scene.patternType === "gray-16") { bgCanvas.style.backgroundImage = generateStepGradient(16); }
            else if (scene.patternType === "gray-64") { bgCanvas.style.backgroundImage = generateStepGradient(64); }
            else if (scene.patternType === "gradient-rgb") { bgCanvas.style.backgroundImage = "linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)"; }
            else if (scene.patternType === "grid-distortion") {
                body.style.backgroundColor = "#000";
                bgCanvas.style.backgroundImage = "linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px)";
                bgCanvas.style.backgroundSize = "40px 40px";
            }
            else if (scene.patternType === "motion-blur") {
                body.style.backgroundColor = "#121212";
                const block = document.createElement('div');
                block.className = 'motion-block';
                bgCanvas.appendChild(block);
                
                let posX = 0; let speed = 8;
                function animateMotion() {
                    posX += speed;
                    if (posX > window.innerWidth - 120 || posX < 0) speed = -speed;
                    block.style.left = posX + 'px';
                    motionAnimId = requestAnimationFrame(animateMotion);
                }
                animateMotion();
            }
            else if (scene.patternType === "grid-1px") { bgCanvas.style.backgroundImage = "linear-gradient(45deg, #000 25%, transparent 25%), linear-gradient(-45deg, #000 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #000 75%), linear-gradient(-45deg, transparent 75%, #000 75%)"; bgCanvas.style.backgroundSize = "2px 2px"; } 
            else if (scene.patternType === "checker") { bgCanvas.style.backgroundImage = "linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000), linear-gradient(45deg, #000 25%, #fff 25%, #fff 75%, #000 75%, #000)"; bgCanvas.style.backgroundSize = "32px 32px"; bgCanvas.style.backgroundPosition = "0 0, 16px 16px"; } 
            else if (scene.patternType === "stripe-h") { bgCanvas.style.backgroundImage = "linear-gradient(#000 50%, #fff 50%)"; bgCanvas.style.backgroundSize = "100% 2px"; } 
            else if (scene.patternType === "stripe-v") { bgCanvas.style.backgroundImage = "linear-gradient(90deg, #000 50%, #fff 50%)"; bgCanvas.style.backgroundSize = "2px 100%"; } 
            else if (scene.patternType === "flash-wb") { body.className = "flash-wb"; } 
            else if (scene.patternType === "gradient-256") { bgCanvas.style.backgroundImage = "linear-gradient(90deg, #000, #fff)"; } 
            else if (scene.patternType === "gradient-dark") { bgCanvas.style.backgroundImage = "linear-gradient(90deg, #000, #1a1a1a)"; } 
            else if (scene.patternType === "gradient-bright") { bgCanvas.style.backgroundImage = "linear-gradient(90deg, #e6e6e6, #fff)"; }
        }
        
        testToast.className = ''; const res = checkResolution();
        testToast.innerHTML = `
            <strong style='color:#34c759;'>${scene.name}</strong>${scene.desc}<br>
            <div style="margin: 4px 0; padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 4px; font-family: monospace;">
                物理屏: ${res.physW}×${res.physH} | 检测区: ${res.renderW}×${res.renderH}
            </div>
            <span>操作提示：轻点屏幕 或 按键盘 ← / → 键切图 | 长按屏幕 或 按 Esc 键退出</span>
        `;
        
        testToast.classList.add('show');
        if (window.toastTimeout) clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => { testToast.classList.remove('show'); }, 1800);
    }

    function exitScreenTest() { 
        stopMotionAnimation();
        bgCanvas.innerHTML = '';
        bgCanvas.style.border = "none";
        body.className = ''; body.classList.remove('ios-viewport-lock'); window.isTestingMode = false; 
        testToast.className = ''; testToast.classList.remove('show'); showPanel(); updateRGB('slider'); lastLockTimestamp = Date.now(); 
        syncWakeLock(); 
    }

    bgCanvas.addEventListener('click', (e) => {
        if (Date.now() - lastLockTimestamp < 300) { e.stopImmediatePropagation(); e.preventDefault(); return; }
        if (!window.isTestingMode) { if (panel.classList.contains('hidden')) { showPanel(); } else { hidePanel(); } return; }
        if (isLongPressAction) { isLongPressAction = false; e.stopImmediatePropagation(); return; }
        renderScene(1);
    });

    function startPress(e) { if (!window.isTestingMode) return; isLongPressAction = false; touchTimer = setTimeout(() => { isLongPressAction = true; exitScreenTest(); }, 1500); }
    function cancelPress() { if (touchTimer) clearTimeout(touchTimer); }

    bgCanvas.addEventListener('pointerdown', startPress); bgCanvas.addEventListener('pointerup', cancelPress); bgCanvas.addEventListener('pointercancel', cancelPress); bgCanvas.addEventListener('pointerleave', cancelPress);

    window.addEventListener('keydown', (e) => {
        if (!window.isTestingMode) { if (e.key === "Escape" || e.key === "F11") toggleFullscreen(); return; }
        if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { renderScene(1); e.preventDefault(); } 
        else if (e.key === "ArrowLeft") { renderScene(-1); e.preventDefault(); } 
        else if (e.key === "Escape") { exitScreenTest(); e.preventDefault(); }
    });

    function hidePanel() { if (window.isTestingMode) return; panel.classList.add('hidden'); isPanelHidden = true; resetWakeBtnTimer(); }
    function showPanel() { panel.classList.remove('hidden'); wakeBtn.classList.remove('visible'); isPanelHidden = false; if (hideTimeout) clearTimeout(hideTimeout); checkResolution(); }

    function resetWakeBtnTimer() {
        if (!isPanelHidden || window.isTestingMode) return; 
        wakeBtn.classList.add('visible'); if (hideTimeout) clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => { wakeBtn.classList.remove('visible'); }, 3500); 
    }

    window.addEventListener('mousemove', resetWakeBtnTimer); window.addEventListener('touchmove', resetWakeBtnTimer); window.addEventListener('touchstart', resetWakeBtnTimer);
    updateRGB('slider'); 
</script>

        setTimeout(function(){ try{ syncWakeLock(); }catch(e){} },200);
    }

})();
